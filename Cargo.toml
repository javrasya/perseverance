[workspace]
resolver = "2"
members = [
  "crates/model",
  "crates/github",
  "crates/agent",
  "crates/pty",
  "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/javrasya/perseverance"

[workspace.dependencies]
perseverance-model = { path = "crates/model" }
perseverance-github = { path = "crates/github" }
perseverance-agent = { path = "crates/agent" }
perseverance-pty = { path = "crates/pty" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true

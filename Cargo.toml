[workspace]
resolver = "2"
members = [
  "crates/model",
  "crates/github",
  "crates/agent",
  "crates/pty",
  "crates/store",
  "crates/env",
  "crates/worktree",
  "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/javrasya/perseverance"

[workspace.dependencies]
perseverance-model = { path = "crates/model" }
perseverance-github = { path = "crates/github" }
perseverance-agent = { path = "crates/agent" }
perseverance-pty = { path = "crates/pty" }
perseverance-store = { path = "crates/store" }
perseverance-env = { path = "crates/env" }
perseverance-worktree = { path = "crates/worktree" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# The one PTY implementation in the workspace, and only `perseverance-pty` may
# name it — `scripts/check-model-purity.mjs` already forbids it, by name, in the
# tree where a child process would break the primary seam.
#
# ConPTY-only on Windows and `openpty` + `setsid` + `TIOCSCTTY` on unix, with no
# legacy-console branch to maintain. `docs/research/pty-spawn-agent-clis.md` §2
# records the whole of the API this uses and the three sharp edges in it.
portable-pty = "0.9"

# The Windows half of *no orphans*, and the reason this workspace can still
# forbid `unsafe` in the crate that owns children: a job object needs three
# Win32 calls, and this crate is a safe wrapper over exactly those. Unix needs
# no equivalent — `portable-pty`'s `pre_exec` already calls `setsid`, so the
# child is a session leader and the kernel keeps the tree for us.
win32job = "2"

# `bundled` compiles the SQLite amalgamation with `cc` and uses pre-generated
# bindings, so neither a system SQLite nor libclang is needed on a bare runner.
#
# Held at 0.37 rather than the newest line: `libsqlite3-sys` 0.38.1 builds its
# build script with `cfg_select!`, stable only since Rust 1.93, and this
# workspace's `rust-version` is 1.82. A toolchain floor is a promise to whoever
# builds this, so it is the dependency that moves, not the floor.
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"

# The only HTTP client in the workspace, and only `perseverance-github` may name
# it — `scripts/check-model-purity.mjs` already forbids it, by name, in the one
# tree where it would break the primary seam.
ureq = { version = "3", features = ["platform-verifier"] }

[profile.release]
codegen-units = 1
lto = true
strip = true

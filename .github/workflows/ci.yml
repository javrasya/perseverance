name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Windows and macOS ship together; Linux is deliberately later.
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Types
        run: npm run typecheck

      # macOS is the CSS floor, not Windows. The floor is declared in
      # package.json's browserslist and enforced here, so a violation is a red
      # build on both runners rather than a rendering surprise on one.
      - name: CSS floor (Safari 16.4)
        run: npm run check:css-floor

      # SMIL prohibition and the token-tier rule.
      - name: Stack-level checks
        run: npm test

      # WebKit and nothing else. macOS ships a WebView pinned to the OS version
      # and exposes no WebDriver, so this is the only place the tighter CSS
      # floor is ever exercised in a browser; a Chromium-only run would be
      # blind to the platform most likely to break first. Chromium stays a
      # developer's opt-in and is deliberately not installed here, so nothing
      # in CI can come to depend on it. `--with-deps` is Linux-only.
      - name: Conformance browser
        run: npx playwright install webkit

      # The encoding contract's rendered half, over dev:web: no Rust, no PTY
      # and no GitHub behind it, only checked-in fixtures.
      - name: Conformance suite (WebKit)
        run: npm run test:conformance

      # The skips are the record. A check that cannot apply to a state skips
      # with its precondition annotated, and the `line` reporter prints none of
      # that — without this artifact a rule that skipped everywhere and a rule
      # that held everywhere look identical in CI. Uploaded even when the suite
      # goes red, which is exactly when the record is worth reading.
      - name: Conformance report (WebKit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          if-no-files-found: ignore

      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Rust lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      # The primary seam, checked rather than claimed.
      - name: Model crate purity
        run: npm run check:model-purity

      # The arrow ADR 0002 rests on: the agent crate depends on nothing, so
      # #45's planner-side work can never be forced to name the harvest.
      - name: Agent crate solitude
        run: npm run check:agent-solitude

      # Resolution has two tiers and no third one. A candidate list naming
      # /opt/homebrew or shelling out to where.exe would not be incomplete — it
      # would diverge, silently, from what the operator's own shell resolves.
      - name: No install-location probing
        run: npm run check:no-install-probing

      # The bound ADR 0022 traded the old invariant for: inside the operator's
      # repository this app runs `git worktree add` and appends one line, and
      # nothing it runs there is forced.
      - name: Writes inside the operator's repository
        run: npm run check:repo-writes

      - name: Frontend build
        run: npm run build

      # Packaging and signing are out of scope; that the shell compiles and
      # links on both platforms is not.
      - name: Shell build
        run: cargo build --package perseverance-app

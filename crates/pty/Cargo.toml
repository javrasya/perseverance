[package]
name = "perseverance-pty"
description = "PTY and child-process ownership. The one place ConPTY and openpty are spoken."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
perseverance-agent = { workspace = true }

# The workspace's error crate, and the same bargain every other crate here
# struck: a refusal is a sentence, and hand-rolling `Display` eight times is
# how one of the eight quietly stops being one.
thiserror = { workspace = true }

# The one PTY implementation. See the workspace manifest for why this line is
# only allowed to appear here.
portable-pty = { workspace = true }

# The Windows half of the guard. It is a target dependency rather than a
# `cfg!` inside the code because a job object has no unix counterpart to write
# a branch against: `setsid` has already happened by the time the child exists.
[target.'cfg(windows)'.dependencies]
win32job = { workspace = true }

# For the temporary directories the shim check's hand-written byte sequences
# live in. The shim check itself still spawns nothing — `accept` reads a file
# and never runs one, which is the whole reason that gate is checkable on a
# runner with no agent CLI installed. The session tests do spawn, but they spawn
# the platform's own shell rather than an agent, for the same reason.
[dev-dependencies]
tempfile = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

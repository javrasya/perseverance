[package]
name = "perseverance-app"
description = "The thin Tauri shell. Wiring only — no derivation, no policy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The app-level artifact is named `perseverance`. `wayfinder` stays reserved for
# the skill's vocabulary and never appears in a shipped name.
[[bin]]
name = "perseverance"
path = "src/main.rs"

[lib]
name = "perseverance_app"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
perseverance-model = { workspace = true }
perseverance-github = { workspace = true }
perseverance-agent = { workspace = true }
perseverance-pty = { workspace = true }
perseverance-store = { workspace = true }
perseverance-env = { workspace = true }
perseverance-worktree = { workspace = true }
tauri = { version = "2", features = [] }
# The folder picker. It is answered in Rust and only a path crosses to the
# WebView, so the frontend needs no dialog package and no file permission.
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }

# For the one test that runs a real child and then asserts the directory it ran
# in is exactly as it was. The compile-time half of "never touches disk" needs
# nothing; this is the other half.
#
# `tauri/test` is the other dev-only feature, and it is here for one reason:
# `poll_once` takes an `AppHandle`, so without a mock app the only assertions
# available to a test were restatements of its own inputs. With it, five of that
# function's seven returns are driven for real — every one that does not need a
# socket.
[dev-dependencies]
tempfile = { workspace = true }
tauri = { version = "2", features = ["test"] }

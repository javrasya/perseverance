# One query shape, always.
#
# The map list the label found, the graph of whichever map is open, and the
# budget — one document, one round trip. There is no poll/refetch split and no
# fingerprint: the split saves one point per tick, costs more during a live run,
# is blind on `assignees` (the field separating claimed from takeable), and
# cannot construct a whole snapshot.
#
# `@include(if: $open)` is why $number may be anything when no map is open: the
# field is skipped rather than asked for issue zero.
#
# `pageInfo` is a tripwire, not a cursor. GitHub caps sub-issues at 100 per
# parent and linked issues at 50 per relationship, so neither page can exist —
# and a paging loop for a page that cannot exist is code nobody has ever run.
#
# `labels` is the exception, and it carries the tripwire for a different reason.
# There is no product cap on how many labels an issue may hold, so an eleventh
# label is ordinary rather than impossible — and a truncated label list is the
# one truncation that fails *unsafe*: a `platform:` label cut off the end reads
# as a ticket that said nothing about machines, which is offered everywhere. So
# the ceiling is 100 (the connection maximum GitHub will answer in one page) and
# `hasNextPage` is parsed and reported like the other three.
query MapRead($owner: String!, $repo: String!, $number: Int!, $open: Boolean!) {
  repository(owner: $owner, name: $repo) {
    # Which repository this answer is about. A blocker carries its own, and an
    # issue number means nothing outside the repository that issued it — so
    # without this pair, `o/r#75` and `other/repo#75` are one edge between the
    # same two boxes on the graph.
    nameWithOwner

    maps: issues(
      first: 100
      labels: ["wayfinder:map"]
      states: [OPEN, CLOSED]
      orderBy: { field: UPDATED_AT, direction: DESC }
    ) {
      pageInfo { hasNextPage }
      nodes { number title state url updatedAt }
    }

    issue(number: $number) @include(if: $open) {
      number title state body url updatedAt
      labels(first: 100) { pageInfo { hasNextPage } nodes { name } }
      subIssues(first: 100) {
        pageInfo { hasNextPage }
        nodes {
          number title state stateReason url updatedAt
          labels(first: 100) { pageInfo { hasNextPage } nodes { name color } }
          assignees(first: 5) { nodes { login } }
          issueDependenciesSummary { blockedBy totalBlockedBy blocking totalBlocking }
          blockedBy(first: 50) {
            pageInfo { hasNextPage }
            nodes { number title state repository { nameWithOwner } }
          }
        }
      }
    }
  }

  rateLimit { cost nodeCount limit remaining resetAt }
}
